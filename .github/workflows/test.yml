name: Test

# Runs for pull requests into main, where branch protection requires the `test`
# check, and as the first job of the production deployment.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Go vet and tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Deployment script tests
        run: |
          make test-deploy test-backup test-verify-public
          ./scripts/ci-deploy.sh validate
      - name: Compose renders with a pinned image
        run: |
          PUBLIC_BASE_URL=https://hooklook.example ADMIN_TOKEN=ci \
            HOOKLOOK_IMAGE="ghcr.io/example/hooklook@sha256:$(printf '0%.0s' {1..64})" \
            docker compose --env-file /dev/null --profile observability config --quiet
